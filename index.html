dth:460px}.floating{position:absolute;bottom:22px;left:24px;right:24px;background:#fffdf3;padding:15px 18px;border-radius:12px;font-size:13px}.stats{display:flex;gap:40px;padding:20px 0 32px;border-bottom:1px solid var(--line)}.stats strong{display:block;font-size:25px}.stats span{font-size:12px;color:#52675e}.section{padding:40px 0}.sectionhead{display:flex;justify-content:space-between;align-items:end;gap:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fffdf6;border:1px solid var(--line);border-radius:13px;padding:26px}.card .num{font-family:Georgia,serif;font-size:32px;display:block;margin-bottom:20px}.card p{color:#4c625b;font-size:14px}.card button{border:0;background:none;color:var(--green);padding:0;font-weight:700}.pill{font-size:11px;background:#eaf0df;padding:4px 9px;border-radius:15px}.banner{background:var(--ink);color:white;border-radius:15px;padding:30px;display:flex;gap:30px;justify-content:space-between;align-items:center;margin:30px 0}.banner p{margin:0;color:#d8e4d7}.banner .btn{background:var(--lime);color:var(--ink);white-space:nowrap}.pagehead{padding:45px 0 25px;max-width:800px}.pagehead p{color:#50675e}.tabs{display:flex;gap:9px;margin:12px 0 25px;flex-wrap:wrap}.tabs button{padding:9px 17px;border:1px solid var(--line);border-radius:30px;background:white;color:var(--ink)}.tabs button.active{background:var(--ink);color:white}.two{display:grid;grid-template-columns:1fr 1fr;gap:25px}.note{border-left:3px solid var(--coral);padding:12px 18px;background:#fff2e8;margin:20px 0;font-size:14px}.progress{height:7px;background:#dee4d7;border-radius:10px;overflow:hidden;margin:14px 0}.progress span{display:block;height:100%;background:var(--green)}.option{display:block;width:100%;text-align:left;border:1px solid var(--line);padding:15px;margin:10px 0;background:white;border-radius:8px;color:var(--ink)}.option:hover{border-color:var(--green)}.feedback{padding:15px;background:#edf2dc;margin-top:12px;border-radius:8px}label{display:block;margin:14px 0 6px;font-weight:600;font-size:14px}input,select,textarea{width:100%;padding:11px;border:1px solid #a8b8aa;border-radius:6px;background:white;color:var(--ink)}textarea{min-height:90px}.check{display:flex;gap:10px;font-weight:400}.check input{width:18px}.resource{display:block;text-decoration:none;border-bottom:1px solid var(--line);padding:18px 0}.resource strong{display:block}.resource span{font-size:13px;color:#50675e}.science{min-height:300px;background:#e9eddf;border-radius:15px;display:grid;place-items:center;padding:20px}.science svg{width:100%;max-height:310px}.concepts{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.concepts button{border:1px solid var(--green);background:white;color:var(--green);padding:9px 15px;border-radius:25px}footer{border-top:1px solid var(--line);padding:25px 5%;font-size:12px;color:#52675e;display:flex;justify-content:space-between;gap:25px}.sr{position:absolute;left:-9999px}.contrast{--paper:#fff;--ink:#092c24;--line:#7b8a7a}.large{font-size:19px}.large p,.large .card p{font-size:18px}details{border-bottom:1px solid var(--line);padding:16px 0}summary{cursor:pointer;font-weight:650}.complete{color:#426441;font-size:12px}video{width:100%;max-height:350px;background:#173a33;border-radius:12px}@media(max-width:900px){header{flex-wrap:wrap}nav{order:3;width:100%}.hero{gap:25px}.grid{grid-template-columns:1fr 1fr}.art{min-height:350px}.tools{margin-left:auto}}@media(max-width:600px){.hero,.two{grid-template-columns:1fr}.hero{padding-top:30px}.art{min-height:330px;order:2}.grid{grid-template-columns:1fr}.stats{gap:25px}.sectionhead,.banner{align-items:start;flex-direction:column}h1{font-size:49px}nav button{font-size:13px;padding:8px}.layout{padding:0 6%}footer{flex-direction:column}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}@media print{header,footer,nav,.actions,.noprint{display:none!important}body{background:white}.layout{padding:0}.card{break-inside:avoid}main{min-height:0}}
</style><link rel="stylesheet" href="upgrade.css"><link rel="stylesheet" href="final-polish.css"><link rel="stylesheet" href="juegos.css"><meta name="theme-color" content="#294b9d"></head><body><a class="sr" href="#main">Saltar al contenido</a><header><a href="#inicio" class="brand">✳ Señas que enseñan<small>LABORATORIO DOCENTE</small></a><nav aria-label="Principal"></nav><div class="tools"><button id="size" aria-label="Aumentar tamaño del texto">A+</button><button id="contrast" aria-label="Cambiar contraste">◐</button></div></header><main id="main" class="layout" tabindex="-1"></main><footer><span>Señas que enseñan · I.E. Alberto Lleras Camargo<br>Ciencias Naturales · Colombia</span><span>Un proyecto de Sara Sofía Castañeda, Marian Stefani Patalagua<br>y Tania Jasbleidy Peña</span></footer><script>
const $=s=>document.querySelector(s),main=$('#main');let data;try{data=JSON.parse(localStorage.getItem('senasOVA')||'{}')}catch{data={}}data.done??=[];const save=()=>localStorage.setItem('senasOVA',JSON.stringify(data));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let lesson=0,topic=0,qi=0,score=0,mode='diagnostico';const navs=[['inicio','Inicio'],['ruta','Mi ruta'],['ciencias','Aula de ciencias'],['taller','Diseña tu clase'],['recursos','Biblioteca']];const go=p=>location.hash=p;function head(k,t,p){return `<div class="pagehead"><div class="eyebrow">${k}</div><h2>${t}</h2><p>${p}</p></div>`}const art=`<svg viewBox="0 0 470 420" role="img" aria-label="Ilustración de una planta, una célula y conexiones que representan el aprendizaje visual"><circle cx="240" cy="187" r="132" fill="#cedda6"/><path d="M228 305V151M228 230Q137 240 145 163Q219 159 228 230M228 189Q304 197 309 121Q239 116 228 189" fill="#41694e" stroke="#204c3e" stroke-width="5"/><path d="M190 304h80l-10 60h-60z" fill="#eaa083"/><circle cx="101" cy="104" r="49" fill="#fffbed" stroke="#65816a" stroke-width="2"/><ellipse cx="101" cy="104" rx="33" ry="26" fill="#d3dcae"/><circle cx="104" cy="101" r="12" fill="#d88c72"/><path d="M332 250l48-27 48 27v55l-48 27-48-27z" fill="#fff8e8" stroke="#67846b" stroke-width="2"/><circle cx="380" cy="275" r="11" fill="#dd9279"/><path d="M352 275h56M380 247v56" stroke="#386353" stroke-width="3"/><path d="M125 104h87M274 183l66 67" stroke="#68876d" stroke-dasharray="5 7" fill="none"/><text x="63" y="41" font-size="12" fill="#204c3e" font-family="sans-serif">OBSERVAR</text><text x="320" y="368" font-size="12" fill="#204c3e" font-family="sans-serif">CONECTAR</text></svg>`;
const lessons=[{title:'Comprender antes de adaptar',time:'8 min',tag:'Inclusión y diversidad',text:'La sordera no define una única forma de aprender. Las preferencias de comunicación, la trayectoria lingüística y los apoyos varían entre personas. Pregunta al estudiante cómo prefiere comunicarse y acuerda los apoyos con él y con el equipo educativo.',points:[['Identifica la barrera','Una explicación solo oral o un video sin acceso lingüístico puede impedir participar. Analiza el entorno, sin atribuir la dificultad a falta de capacidad.'],['Cuida la interacción','Habla de frente, con buena iluminación y turnos visibles. Evita explicar mientras escribes de espaldas. No supongas que todas las personas sordas leen los labios.'],['Acuerda los apoyos','Los textos, imágenes y subtítulos complementan el acceso. La LSC y la interpretación se planifican según las necesidades del estudiante.']],q:'Vas a recibir a un estudiante sordo. ¿Cuál es tu primer paso?',opts:['Preguntarle por sus preferencias comunicativas y coordinar apoyos.','Hablar más fuerte en todas las clases.','Reducir los objetivos de aprendizaje.'],a:0,why:'La valoración y el diálogo orientan apoyos pertinentes; no se deben asumir necesidades idénticas.'},{title:'Acercarse a una lengua visual',time:'12 min',tag:'Introducción a la LSC',text:'La Lengua de Señas Colombiana es una lengua natural con organización gramatical propia. Las manos, el espacio, la orientación, el movimiento y los componentes no manuales participan en la construcción del significado. No es español representado palabra por palabra ni una lengua universal.',points:[['Observa material auténtico','Consulta el diccionario y los recursos bilingües de INSOR. Mira la secuencia completa, la expresión y el contexto de uso.'],['Aprende con la comunidad','Busca formación con personas sordas y profesionales competentes. Una lista de palabras o el alfabeto manual no equivale a dominar la LSC.'],['Registra sin inventar','Para cada término científico anota su concepto, la fuente y su contexto. Pueden existir variantes regionales; valida con el equipo lingüístico.']],q:'¿Cómo preparar el vocabulario de una clase sobre ecosistemas?',opts:['Inventar un gesto para cada palabra y presentarlo como LSC.','Consultar recursos de INSOR y validar el uso con personas competentes en LSC.','Traducir cada palabra del español con el alfabeto manual.'],a:1,why:'Los conceptos y usos lingüísticos se contrastan con fuentes confiables. La dactilología no sustituye la explicación de los conceptos.'},{title:'Ciencias que se pueden explorar',time:'15 min',tag:'Estrategias y DUA',text:'Define primero qué debe comprender el estudiante. Después ofrece representaciones complementarias: modelos, secuencias de imágenes, texto claro y acceso lingüístico. Da distintas formas de demostrar el mismo aprendizaje, conservando la exigencia conceptual.',points:[['Antes de la clase','Anticipa objetivo, vocabulario y una guía visual. Revisa la accesibilidad de videos y coordina recursos e interpretación cuando se requiera.'],['Durante la experiencia','Separa los tiempos de observar, atender la explicación y registrar. Usa turnos y señales visuales de seguridad; comprueba comprensión con una tarea.'],['Al evaluar','Permite un modelo, esquema rotulado, explicación escrita o en LSC según los apoyos acordados. Usa criterios equivalentes y retroalimentación concreta.']],q:'¿Qué evidencia evalúa mejor la comprensión de una célula?',opts:['Repetir en voz alta una definición.','Copiar muchas palabras sin relacionarlas.','Construir un modelo y explicar las funciones mediante una modalidad accesible.'],a:2,why:'La evidencia debe mostrar relaciones y funciones; el canal de respuesta no debe convertirse en una barrera.'}];
const questions=[['La LSC es…',['Una lengua natural con gramática propia.','Una lengua universal.','Español hecho con gestos.'],0,'La LSC tiene organización lingüística propia y no es universal.'],['Si un estudiante no accede a un video oral…',['Se omite su participación.','Se ofrecen acceso lingüístico y apoyos visuales pertinentes.','Se baja la dificultad del contenido.'],1,'Se transforma la forma de acceso, manteniendo el propósito de aprendizaje.'],['Para conocer los apoyos necesarios conviene…',['Suponer que basta con leer labios.','Usar el mismo apoyo para todos.','Dialogar con el estudiante y coordinar la valoración educativa.'],2,'Las necesidades y preferencias comunicativas son diversas.'],['Una evaluación inclusiva de estados de la materia puede…',['Aceptar un modelo explicado con criterios comunes.','Medir solo la pronunciación.','Eliminar toda evaluación.'],0,'Se evalúa el concepto científico con modalidades accesibles.'],['¿Qué recurso sirve para contrastar vocabulario en LSC?',['Gestos generados automáticamente sin revisión.','El diccionario y repositorio de INSOR.','Una lista de otra lengua de señas asumida como equivalente.'],1,'Es importante revisar la fuente, el contexto y las variantes de la LSC.']];
function render(){const p=location.hash.slice(1)||'inicio';$('nav').innerHTML=navs.map(([id,t])=>`<button ${p===id?'aria-current="page"':''} onclick="go('${id}')">${t}</button>`).join('');if(p==='inicio')home();else if(p==='juegos'&&typeof renderGameHub==='function'&&window.gameHubReady)renderGameHub();else if(p==='ruta')route();else if(p==='ciencias')science();else if(p==='taller')workshop();else if(p==='recursos')resources();else if(p==='quiz')quiz();else if(p==='valoracion')rating();else home()}
function home(){main.innerHTML=`<section class="hero"><div><span class="tag">Para docentes que abren nuevas posibilidades</span><h1>La ciencia también<br>se enseña con<br><em style="font-family:Georgia;font-weight:400">las manos.</em></h1><p>Un espacio para acercarte a la Lengua de Señas Colombiana y transformar tus clases en experiencias más visuales, accesibles y participativas.</p><div class="actions"><button class="btn" onclick="startQuiz('diagnostico')">Descubre tu punto de partida ↗</button><button class="btn light" onclick="go('ruta')">Explorar la ruta</button></div><p style="font-size:12px;margin-top:18px">A tu ritmo · Sin audio obligatorio · Progreso en este navegador</p></div><div class="art">${art}<div class="floating"><strong>Una mirada distinta. El mismo potencial.</strong><br>Comprender la diversidad es el primer paso para enseñar.</div></div></section><div class="stats"><div><strong>03</strong><span>Estaciones de aprendizaje</span></div><div><strong>03</strong><span>Exploradores de ciencias</span></div><div><strong>01</strong><span>Clase lista para diseñar</span></div></div><section class="section"><div class="sectionhead"><div><div class="eyebrow">TU RECORRIDO</div><h2>De la reflexión al aula.</h2></div><p>Pequeños pasos. Decisiones que incluyen.</p></div><div class="grid">${lessons.map((l,i)=>`<article class="card"><span class="num">0${i+1} <span class="pill">${l.time}</span></span><h3>${l.title}</h3><p>${l.tag}</p><button onclick="lesson=${i};go('ruta')">Explorar estación ↗</button></article>`).join('')}</div></section><div class="banner"><div><h3>Tu próxima clase puede abrir más puertas.</h3><p>Convierte un tema de ciencias en un plan accesible y editable.</p></div><button class="btn" onclick="go('taller')">Entrar al taller →</button></div><p style="font-size:13px">Propuesta de preparación institucional. No presupone matrícula actual de estudiantes sordos. Este acercamiento no sustituye la formación especializada en LSC ni los apoyos de interpretación.</p>`}
function route(){let l=lessons[lesson];main.innerHTML=head('RUTA DE APRENDIZAJE','Aprender para incluir.','Explora las tres estaciones, toma una decisión de aula y recibe retroalimentación.')+`<p class="complete">${data.done.length} de 3 estaciones completadas</p><div class="progress"><span style="width:${data.done.length/3*100}%"></span></div><div class="tabs">${lessons.map((l,i)=>`<button class="${i===lesson?'active':''}" onclick="lesson=${i};route()">${data.done.includes(i)?'✓ ':''}0${i+1} · ${l.tag}</button>`).join('')}</div><div class="two"><article class="card"><span class="eyebrow">ESTACIÓN 0${lesson+1} · ${l.time}</span><h2 style="font-size:38px;margin-top:15px">${l.title}</h2><p>${l.text}</p>${l.points.map(([t,p])=>`<details open><summary>${t}</summary><p>${p}</p></details>`).join('')}${lesson===1?'<a class="btn light" href="https://educativo.insor.gov.co/catdiccionario/temario/" target="_blank" rel="noopener">Explorar el diccionario INSOR ↗</a>':''}</article><aside class="card route-challenge"><div class="eyebrow">✦ RETO DE AULA</div><h3 style="margin-top:15px">${l.q}</h3>${l.opts.map((o,i)=>`<button class="option" onclick="lessonAnswer(${i})">${o}</button>`).join('')}<div id="lf" aria-live="polite"></div></aside></div><div class="actions section"><button class="btn light" onclick="go('ciencias')">Explorar Ciencias Naturales</button><button class="btn" onclick="startQuiz('final')">Evaluación de cierre</button></div>`}
function lessonAnswer(i){let l=lessons[lesson],ok=i===l.a;if(ok&&!data.done.includes(lesson)){data.done.push(lesson);save()}$('#lf').innerHTML=`<div class="feedback"><strong>${ok?'✓ Decisión pertinente.':'Revisa tu decisión.'}</strong><p>${l.why}</p>${ok?`<button class="btn" onclick="${lesson<2?'lesson++;route()':"go('taller')"}">${lesson<2?'Siguiente estación →':'Diseñar mi clase →'}</button>`:''}</div>`}
function startQuiz(m){mode=m;qi=0;score=0;if(location.hash==='#quiz')quiz();else go('quiz')}
function quiz(){main.innerHTML=head(mode==='final'?'EVALUACIÓN DE CIERRE':'DIAGNÓSTICO INICIAL',mode==='final'?'Comprueba tus decisiones.':'¿Desde dónde comienzas?','Cinco preguntas de selección única. Es una autoevaluación orientativa, no una certificación en LSC.')+`<div class="card" style="max-width:850px"><span class="eyebrow">PREGUNTA ${qi+1} DE 5</span><div class="progress"><span style="width:${qi*20}%"></span></div><h3>${questions[qi][0]}</h3>${questions[qi][1].map((o,i)=>`<button class="option" onclick="quizAnswer(${i})">${o}</button>`).join('')}<div id="qf" aria-live="polite"></div></div>`}
function quizAnswer(i){main.querySelectorAll('.option').forEach(b=>b.disabled=true);let q=questions[qi],ok=i===q[2];if(ok)score++;$('#qf').innerHTML=`<div class="feedback"><strong>${ok?'✓ Correcto':'Una oportunidad para aprender'}</strong><p>${q[3]}</p><button class="btn" onclick="quizNext()">${qi===4?'Ver resultado':'Continuar →'}</button></div>`}
function quizNext(){if(++qi<5){quiz();return}data[mode]={score,date:new Date().toLocaleDateString('es-CO')};save();main.innerHTML=head('TU RESULTADO',`${score} de 5 decisiones acertadas.`,score<4?'Te recomendamos recorrer las estaciones y volver a intentarlo.':'Continúa aplicando estos criterios en tu planeación.')+`<div class="card"><p>Este resultado refleja conocimientos introductorios, no competencia comunicativa en LSC.</p>${data.diagnostico&&data.final?`<p>Diagnóstico: <strong>${data.diagnostico.score}/5</strong> · Cierre: <strong>${data.final.score}/5</strong>. Comparación individual; no demuestra por sí sola el impacto del proyecto.</p>`:''}<div class="actions"><button class="btn" onclick="go('ruta')">Ir a mi ruta</button><button class="btn light" onclick="go('valoracion')">Valorar el OVA</button></div></div>`}
const topics=[{title:'Ecosistemas',goal:'Explicar relaciones entre componentes bióticos y abióticos de un ecosistema.',labels:['Sol','Agua','Plantas','Descomponedores'],desc:['La luz aporta energía para la fotosíntesis. No todos los organismos obtienen energía directamente del Sol.','El agua es un componente abiótico esencial. Su disponibilidad influye en los organismos del ecosistema.','Las plantas producen materia orgánica mediante fotosíntesis y forman parte de redes alimentarias.','Hongos y bacterias descomponen materia orgánica y contribuyen al reciclaje de nutrientes.'],activity:'Construir una red con tarjetas y flechas rotuladas. Pedir que explique una relación y prediga qué ocurriría si cambia el agua disponible.',svg:'<circle cx="70" cy="55" r="28" fill="#e9b95e"/><path d="M25 230Q120 160 230 220T430 210V290H25" fill="#a8c47f"/><path d="M180 225v-95M180 180q-60 5-53-50q55 0 53 50M180 158q55 3 55-48q-48 0-55 48" fill="#477455" stroke="#315b44" stroke-width="4"/><path d="M285 235q35-38 100-5" fill="none" stroke="#6bafbd" stroke-width="15"/><path d="M100 80l50 47M230 220l65 20" stroke="#496e53" stroke-width="3" stroke-dasharray="6 7"/>'},{title:'La célula',goal:'Relacionar membrana, citoplasma y material genético con sus funciones básicas.',labels:['Membrana','Citoplasma','Material genético'],desc:['La membrana delimita la célula y regula intercambios con el entorno.','El citoplasma es el medio interno donde ocurren numerosos procesos celulares.','El ADN contiene información hereditaria. En células eucariotas gran parte se encuentra en el núcleo; las procariotas no tienen núcleo delimitado.'],activity:'Crear un modelo de célula eucariota con etiquetas. Asociar estructura y función, y aclarar que el modelo no representa todos los tipos celulares.',svg:'<ellipse cx="225" cy="150" rx="165" ry="112" fill="#aac69c" stroke="#315f4b" stroke-width="10"/><ellipse cx="225" cy="150" rx="140" ry="91" fill="#dbe4bd"/><circle cx="220" cy="145" r="43" fill="#dc9c88" stroke="#966c62" stroke-width="3"/><path d="M202 122q40 5 0 25t30 23" stroke="#805a55" fill="none" stroke-width="4"/><ellipse cx="120" cy="140" rx="23" ry="12" fill="#b2c6a1"/><ellipse cx="310" cy="180" rx="23" ry="12" fill="#b2c6a1"/>'},{title:'Estados de la materia',goal:'Distinguir sólido, líquido y gas mediante organización y movilidad de partículas.',labels:['Sólido','Líquido','Gas'],desc:['En un sólido, las partículas están próximas y oscilan alrededor de posiciones relativamente fijas. Tiene forma y volumen definidos.','En un líquido, las partículas permanecen próximas y se desplazan unas respecto de otras. Tiene volumen definido y adopta la forma del recipiente.','En un gas, las partículas están muy separadas y se mueven libremente. Se expande para ocupar el recipiente.'],activity:'Comparar tres modelos de partículas y justificar una clasificación. Observar hielo que se derrite sin confundir el cambio de estado con la desaparición de la materia.',svg:[0,1,2].map((n)=>`<rect x="${20+n*145}" y="45" width="120" height="190" rx="8" fill="#f8f7eb" stroke="#6e8974"/>`+Array.from({length:12},(_,i)=>`<circle cx="${n===0?40+(i%3)*30:n===1?185+(i%3)*30+(i%2)*6:325+(i%3)*35}" cy="${n===0?120+Math.floor(i/3)*27:n===1?130+Math.floor(i/3)*24:70+Math.floor(i/3)*45}" r="7" fill="${['#4b7054','#6c9baf','#cb896f'][n]}"/>`).join('')).join('')}];
function science(){let t=topics[topic];main.innerHTML=head('AULA DE CIENCIAS','Haz visible el concepto.','Exploradores visuales para ensayar decisiones didácticas. Las ilustraciones son modelos simplificados; no representan señas.')+`<div class="tabs">${topics.map((t,i)=>`<button class="${i===topic?'active':''}" onclick="topic=${i};science()">${t.title}</button>`).join('')}</div><div class="two"><div><div class="science"><svg viewBox="0 0 450 300" role="img" aria-label="Modelo visual de ${t.title}">${t.svg}</svg></div><div class="concepts">${t.labels.map((l,i)=>`<button onclick="$('#concept').textContent=topics[topic].desc[${i}]">${l}</button>`).join('')}</div><div id="concept" class="feedback" aria-live="polite">Selecciona un concepto para explorar su función.</div></div><article class="card"><div class="eyebrow">PROPÓSITO DE APRENDIZAJE</div><h3>${t.goal}</h3><h4>Una experiencia accesible</h4><p>${t.activity}</p><h4>Antes de llevarla al aula</h4><p>Anticipa vocabulario, acuerda acceso lingüístico y permite observar el modelo antes de explicar. Usa flechas con etiquetas y verifica la comprensión con una producción del estudiante.</p><button class="btn" onclick="data.plan={...(data.plan||{}),tema:topics[topic].title,objetivo:topics[topic].goal};save();go('taller')">Diseñar con este tema →</button></article></div><div class="banner"><div><h3>De la imagen al acceso lingüístico.</h3><p>Complementa la actividad con materiales auténticos en LSC.</p></div><a class="btn" href="https://educativo.insor.gov.co/edu/course/index.php?categoryid=2" target="_blank" rel="noopener">Ciencias en INSOR ↗</a></div>`}
function workshop(){let p=data.plan||{};main.innerHTML=head('TALLER DE PLANEACIÓN','Una clase. Más formas de participar.','Construye un borrador de clase accesible, guárdalo en este navegador y expórtalo para adaptarlo con tu equipo.')+`<div class="two"><form id="plan" class="card"><label for="tema">Tema</label><input id="tema" name="tema" value="${esc(p.tema)}" placeholder="Ej. Ecosistemas del entorno"><label for="grado">Grado y duración</label><input id="grado" name="grado" value="${esc(p.grado)}" placeholder="Ej. 6.º · 50 minutos"><label for="objetivo">¿Qué debe comprender el estudiante?</label><textarea id="objetivo" name="objetivo">${esc(p.objetivo)}</textarea><label for="barrera">Barrera y preferencias comunicativas por valorar</label><textarea id="barrera" name="barrera" placeholder="Ej. Explicación solo oral; acordar acceso en LSC y apoyos escritos.">${esc(p.barrera)}</textarea><label for="actividad">Secuencia: observar → explorar → explicar</label><textarea id="actividad" name="actividad">${esc(p.actividad)}</textarea><label for="evidencia">Evidencia y criterio de aprendizaje</label><textarea id="evidencia" name="evidencia" placeholder="Ej. Esquema que relaciona tres componentes y explica una interacción.">${esc(p.evidencia)}</textarea><button class="btn" type="submit">Guardar y generar plan →</button><p id="saved" aria-live="polite"></p></form><aside><div class="card"><div class="eyebrow">REVISIÓN DE ACCESIBILIDAD</div><h3>Antes de entrar al aula</h3>${['Objetivo y vocabulario anticipados.','Recursos con texto claro y apoyos visuales.','Acceso lingüístico y apoyos acordados.','Tiempo separado para observar y atender.','Turnos y señales visuales de seguridad.','Opciones de respuesta y criterios equivalentes.'].map((t,i)=>`<label class="check"><input type="checkbox" ${p.checks?.includes(i)?'checked':''} data-check="${i}">${t}</label>`).join('')}<div class="note">Este plan es un apoyo a la planeación docente; no reemplaza la valoración pedagógica ni el PIAR cuando corresponda.</div></div><div id="output" class="card" style="margin-top:18px">${p.tema?planView(p):'Tu plan aparecerá aquí después de guardarlo.'}</div></aside></div>`;$('#plan').onsubmit=e=>{e.preventDefault();data.plan=Object.fromEntries(new FormData(e.target));data.plan.checks=[...main.querySelectorAll('[data-check]:checked')].map(x=>+x.dataset.check);save();$('#output').innerHTML=planView(data.plan);$('#saved').textContent='✓ Plan guardado en este navegador.'}}
function planView(p){return `<h3>${esc(p.tema||'Mi clase inclusiva')}</h3>${['grado','objetivo','barrera','actividad','evidencia'].map(k=>`<p><strong>${({grado:'Grupo y duración',objetivo:'Objetivo',barrera:'Barrera y apoyos',actividad:'Secuencia',evidencia:'Evidencia'})[k]}</strong><br>${esc(p[k]||'Por completar').replace(/\n/g,'<br>')}</p>`).join('')}<p>${p.checks?.length||0}/6 criterios de accesibilidad revisados.</p><div class="actions noprint"><button class="btn light" onclick="download('plan-clase.txt',planText())">Descargar plan</button><button class="btn light" onclick="print()">Imprimir / PDF</button></div>`}
function planText(){let p=data.plan||{};return 'SEÑAS QUE ENSEÑAN · PLAN DOCENTE\n\n'+Object.entries(p).filter(([k])=>k!=='checks').map(([k,v])=>k.toUpperCase()+': '+v).join('\n\n')+'\n\nCriterios revisados: '+(p.checks?.length||0)+'/6.'}
function download(name,text){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function resources(){main.innerHTML=head('BIBLIOTECA CURADA','Fuentes para seguir aprendiendo.','Recursos externos de consulta. La LSC se aprende con materiales auténticos y participación de la comunidad sorda.')+`<div class="two"><article class="card"><h3>LSC y recursos de aula</h3>${[['https://educativo.insor.gov.co/catdiccionario/temario/','Diccionario temático de LSC · INSOR','Explora vocabulario por campos temáticos.'],['https://educativo.insor.gov.co/catdiccionario/regiones/','Variantes regionales · INSOR','Reconoce la diversidad de uso dentro de Colombia.'],['https://educativo.insor.gov.co/edu/course/index.php?categoryid=2','Ciencias Naturales · INSOR Educativo','Accede al repositorio de recursos educativos.'],['https://conecta.insor.gov.co/','INSOR Conecta','Orientaciones, publicaciones y contenidos accesibles.']].map(([u,t,d])=>`<a class="resource" href="${u}" target="_blank" rel="noopener"><strong>${t} ↗</strong><span>${d}</span></a>`).join('')}<div class="note">Observa el video en su fuente, registra concepto, contexto y variante. No uses imágenes estáticas de manos como sustituto de una seña completa.</div></article><article class="card"><h3>Diseño y marco de referencia</h3><a class="resource" href="https://udlguidelines.cast.org/" target="_blank" rel="noopener"><strong>CAST · Pautas DUA 3.0 ↗</strong><span>Opciones de implicación, representación y acción y expresión. Recurso en inglés.</span></a><a class="resource" href="https://www.funcionpublica.gov.co/eva/gestornormativo/norma.php?i=87040" target="_blank" rel="noopener"><strong>Decreto 1421 de 2017 ↗</strong><span>Atención educativa, apoyos, ajustes razonables y PIAR.</span></a><details><summary>Normas citadas en el proyecto</summary><p>Ley 982 de 2005: equiparación de oportunidades para personas sordas y sordociegas.<br>Ley 1618 de 2013: garantía del ejercicio de derechos de personas con discapacidad.</p></details><details><summary>Alcance y evaluación del proyecto</summary><p>El OVA responde a una propuesta de preparación docente de la I.E. Alberto Lleras Camargo. No presenta resultados de encuestas no realizadas ni afirma una matrícula actual de estudiantes sordos. Las actividades y los exploradores son desarrollos didácticos complementarios al documento base.</p></details><button class="btn light" onclick="go('valoracion')">Valorar claridad y utilidad →</button></article></div><section class="section"><h3>Bitácora de vocabulario</h3><p>Registra términos que quieras contrastar en LSC. Esta bitácora no traduce ni genera señas.</p><label for="notes">Concepto · fuente · contexto · preguntas para validar</label><textarea id="notes">${esc(data.notes)}</textarea><button class="btn" onclick="data.notes=$('#notes').value;save();$('#ns').textContent='✓ Bitácora guardada.'">Guardar bitácora</button> <button class="btn light" onclick="download('bitacora-lsc.txt',$('#notes').value)">Descargar</button><span id="ns" aria-live="polite"></span></section>`}
function rating(){main.innerHTML=head('VALORACIÓN DOCENTE','Tu mirada mejora este espacio.','Valora la claridad, pertinencia y utilidad del OVA. No se solicitan nombres ni datos de estudiantes.')+`<form id="rating" class="card" style="max-width:750px">${['Claridad de los contenidos','Facilidad de navegación','Utilidad para planear Ciencias Naturales','Pertinencia de los recursos'].map((t,i)=>`<label for="r${i}">${t}</label><select id="r${i}" name="${t}" required><option value="">Selecciona una valoración</option>${[1,2,3,4,5].map(n=>`<option>${n} · ${['Muy baja','Baja','Media','Alta','Muy alta'][n-1]}</option>`).join('')}</select>`).join('')}<label for="comment">¿Qué mejorarías?</label><textarea id="comment" name="Comentario"></textarea><p style="font-size:13px">Las respuestas permanecen en este navegador. No se envían a las autoras. Puedes descargar el registro y compartirlo por el canal que acuerdes con ellas.</p><button class="btn" type="submit">Guardar valoración</button><div id="rf" aria-live="polite"></div></form>`;$('#rating').onsubmit=e=>{e.preventDefault();data.rating=Object.fromEntries(new FormData(e.target));save();$('#rf').innerHTML='<p>✓ Valoración guardada localmente.</p><button type="button" class="btn light" onclick="download(\'valoracion-ova.json\',JSON.stringify(data.rating,null,2))">Descargar respuestas</button>'}}
